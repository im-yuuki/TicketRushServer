services:
  server:
    build:
      context: .
      dockerfile: dockerfile
    image: ghcr.io/im-yuuki/ticketrushserver:master
    ports:
      - "8080:8080/tcp"
    environment:
      - SPRING_PROFILES_ACTIVE=production
      - PGSQL_URL=jdbc:postgresql://postgres:5432/ticketrush
      - PGSQL_USR=ticketrush
      - PGSQL_PWD=ticketrush
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    env_file:
      - compose.env
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  postgres:
    image: postgres:latest
    environment:
      - POSTGRES_DB=ticketrush
      - POSTGRES_USER=ticketrush
      - POSTGRES_PASSWORD=ticketrush
#    ports:
#      - target: 5432
#        published: 5432
#        protocol: tcp
#        mode: host
    volumes:
      - pgdata:/var/lib/
    restart: unless-stopped

  redis:
    image: redis:latest
#    ports:
#      - target: 6379
#        published: 6379
#        protocol: tcp
#        mode: host
    restart: unless-stopped

#  elasticsearch:
#    image: elasticsearch:9.3.4
#    environment:
#      - discovery.type=single-node
#      - xpack.security.enabled=false
#      - xpack.monitoring.collection.enabled=true
#    ports:
#      - target: 9200
#        published: 9200
#        protocol: tcp
#        mode: host
#    volumes:
#      - esdata:/usr/share/elasticsearch
#    restart: unless-stopped

volumes:
  pgdata:
#  esdata:

networks:
  default:
    enable_ipv6: true
