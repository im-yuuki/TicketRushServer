          type: "string"
          nullable: true
    OperationResult:
      type: "object"
      properties:
        success:
          type: "boolean"
          nullable: true
        message:
          type: "string"
          nullable: true
        resourceId:
          type: "integer"
          format: "int64"
          nullable: true
    RegisterPayload:
      type: "object"
