components:
  schemas:
    LoginPayload:
      type: "object"
      properties:
        email:
          type: "string"
          nullable: true
        password:
          type: "string"
          nullable: true
    OperationResult:
      type: "object"
      properties:
        success:
          type: "boolean"
          nullable: true
        message:
          type: "string"
          nullable: true
        resourceId:
          type: "integer"
          format: "int64"
          nullable: true
    RegisterPayload:
      type: "object"
      properties:
        name:
          type: "string"
          nullable: true
        email:
          type: "string"
          nullable: true
        password:
          type: "string"
          nullable: true
        birthDate:
          type: "string"
          format: "date-time"
          nullable: true
        gender:
          type: "string"
          nullable: true
          enum:
            - "MALE"
            - "FEMALE"
            - "OTHER"
    OtpConfirmationPayload:
      type: "object"
      properties:
        otpCode:
          type: "string"
          nullable: true
    ResetPasswordPayload:
      type: "object"
      properties:
        email:
          type: "string"
          nullable: true
        newPassword:
          type: "string"
          nullable: true
    Instant:
      type: "object"
      properties: { }
    BasicEventInfo:
      type: "object"
      properties:
        id:
          type: "integer"
          format: "int64"
          nullable: true
        name:
          type: "string"
          nullable: true
        bannerUrl:
          type: "string"
          nullable: true
        dateTime:
          nullable: true
          $ref: "#/components/schemas/Instant"
        venue:
          type: "string"
          nullable: true
    PublicEventInfo:
      type: "object"
      properties: { }
    PublicOrganizationInfo:
      type: "object"
      properties: { }
    BasicUserInfo:
      type: "object"
      properties:
        id:
          type: "integer"
          format: "int64"
          nullable: true
        name:
          type: "string"
          nullable: true
        email:
          type: "string"
          nullable: true
        avatarUrl:
          type: "string"
          nullable: true
    UpdateEmailPayload:
      type: "object"
      properties:
        newEmail:
          type: "string"
          nullable: true
        currentPassword:
          type: "string"
          nullable: true
    UpdateNamePayload:
      type: "object"
      properties:
        newName:
          type: "string"
          nullable: true
    UpdatePasswordPayload:
      type: "object"
      properties:
        currentPassword:
          type: "string"
          nullable: true
        newPassword:
          type: "string"
          nullable: true
    CreateEventPayload:
      type: "object"
      properties:
        name:
          type: "string"
          nullable: true
        description:
          type: "string"
          nullable: true
        isOnlineEvent:
          type: "boolean"
          nullable: true
        venue:
          type: "string"
          nullable: true
        address:
          type: "string"
          nullable: true
        dateTime:
          nullable: true
          $ref: "#/components/schemas/Instant"
    FullEventInfo:
      type: "object"
      properties:
        id:
          type: "integer"
          format: "int64"
          nullable: true
        name:
          type: "string"
          nullable: true
        description:
          type: "string"
          nullable: true
        published:
          type: "boolean"
          nullable: true
        isOnlineEvent:
          type: "boolean"
          nullable: true
        venue:
          type: "string"
          nullable: true
        address:
          type: "string"
          nullable: true
