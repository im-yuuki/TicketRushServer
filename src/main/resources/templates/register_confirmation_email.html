<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Confirm your registration</title>
  <style type="text/css">
    @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@900&display=swap');
  </style>
</head>
<body style="margin:0; padding:0; background-color:#f6f8fb; font-family:Arial, Helvetica, sans-serif; color:#1f2937;">
<div style="max-width:560px; margin:0 auto; padding:32px 20px;">
  <div style="text-align: center; margin: 24px 0;">
    <th:block th:replace="~{logo}"></th:block>
  </div>
  <div style="background:#ffffff; border:1px solid #e5e7eb; border-radius:12px; padding:32px 24px; box-shadow:0 2px 8px rgba(0,0,0,0.04);">
    <p style="margin:0 0 16px; font-size:18px; font-weight:700; line-height:1.5;">Hello <span th:text="${userName}">User</span>,</p>
    <p style="margin:0 0 20px; font-size:15px; line-height:1.6; color:#4b5563;">
      Please enter this one-time passcode to confirm your email address and complete your registration:
    </p>
    <div style="text-align:center; margin:0 0 20px;">
      <div style="display:inline-block; padding:14px 20px; border-radius:10px; background:#fef3c7; color:#92400e; font-size:24px; font-weight:700; letter-spacing:4px;">
        <span th:text="${otpCode}">000000</span>
      </div>
    </div>
    <p style="margin:0; font-size:14px; line-height:1.6; color:#6b7280;">
      This code valid for 10 minutes.<br/>If you did not make this request, please ignore this email.
    </p>
  </div>
</div>
</body>
</html>
